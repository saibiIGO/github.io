<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>囲碁・棋譜並べ＆解説作成ジェネレーター（完成版）</title>
    <style>
        :root {
            --board-color: #dcbc7c;
            --line-color: #000000;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #1a1a1a; margin-bottom: 5px; font-size: 22px; }
        p.subtitle { color: #666; margin: 0 0 20px 0; font-size: 13px; }
        
        .container {
            display: flex;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 碁盤の最も外側の木枠（茶色い縁） */
        .board-container-outer {
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 4px solid #6e4e03;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            background-color: var(--board-color);
        }
        
        .board-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--board-color);
            transform-origin: top left;
            transition: transform 0.3s ease;
        }
        
        .view-all { transform: scale(1) translate(0, 0); }
        .view-tr  { transform: scale(2.1) translate(-52.3%, 0); }
        .view-tl  { transform: scale(2.1) translate(0, 0); }
        .view-br  { transform: scale(2.1) translate(-52.3%, -52.3%); }
        .view-bl  { transform: scale(2.1) translate(0, -52.3%); }

        /* 碁盤の19路の線が走るエリア（周囲に均等な「外べり」を確保） */
        .board-main {
            position: absolute;
            top: 6.5%; 
            left: 6.5%; 
            width: 87%; 
            height: 87%;
            box-sizing: border-box;
        }

        /* 18マス×18マスの格子状に並べ、セルの右側と下側に線を引きます */
        .board-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-rows: repeat(18, 1fr);
            border-top: 1px solid var(--line-color);    /* 1路（一番上の外周線） */
            border-left: 1px solid var(--line-color);   /* 1路（一番左の外周線） */
            box-sizing: border-box;
        }
        
        /* 碁盤を構成するマス目の定義（右と下に線を引くことで綺麗な格子になります） */
        .intersection {
            position: relative;
            border-right: 1px solid var(--line-color);  /* 縦線 */
            border-bottom: 1px solid var(--line-color); /* 横線 */
            box-sizing: border-box;
        }

        /* 碁石を「格子線の交差点」にジャストフィットさせるための、透明なクリック判定エリア */
        .click-target {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 5;
        }
        /* 交差点（マスの角）を中心にずらすための調整 */
        .target-tl { top: -50%; left: -50%; }
        .target-tr { top: -50%; left: 50%; }
        .target-bl { top: 50%; left: -50%; }
        .target-br { top: 50%; left: 50%; }
        
        /* 星（黒いドット）の位置固定 */
        .hoshi-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--line-color);
            border-radius: 50%;
            z-index: 2;
            top: -3px;
            left: -3px;
            pointer-events: none;
        }

        /* 碁石のデザイン：交差点の真上に完璧に中心を合わせます */
        .stone {
            position: absolute; 
            width: 92%; 
            height: 92%;
            border-radius: 50%; 
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 11px; user-select: none;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            top: -46%;
            left: -46%;
        }
        .stone.black { background: radial-gradient(circle at 30% 30%, #444, #000); color: #ffffff; }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #dbdbdb); color: #000000; border: 1px solid #999; }
        
        .stone.latest::after {
            content: ''; width: 90%; height: 90%; border: 2px solid #ff3b30; border-radius: 50%; position: absolute;
        }

        /* 座標ラベルの位置を交差点と100%完全一致させます */
        .labels-row {
            position: absolute; 
            left: 6.5%; 
            width: 87%; 
            height: 6.5%;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: bold; color: #444; user-select: none;
        }
        .labels-row.top { top: 0.5%; }
        .labels-row.bottom { bottom: 0.5%; }

        .labels-col {
            position: absolute; 
            top: 6.5%; 
            height: 87%; 
            width: 6.5%;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: bold; color: #444; user-select: none;
        }
        .labels-col.left { left: 0.5%; }
        .labels-col.right { right: 0.5%; }

        .labels-row span, .labels-col span {
            display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
        }

        .timer-bar {
            width: 100%; max-width: 520px; height: 6px; background-color: #e5e5ea;
            margin-top: 12px; border-radius: 3px; overflow: hidden;
        }
        .timer-progress { width: 0%; height: 100%; background-color: #34c759; transition: width 0.1s linear; }
        
        .controls { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 10px 18px; font-size: 14px; border: none; border-radius: 6px;
            background-color: #007aff; color: white; cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #d1d1d6; cursor: not-allowed; }
        button.stop { background-color: #ff3b30; }
        button.stop:hover { background-color: #c72c22; }

        .right-panel { width: 380px; display: flex; flex-direction: column; gap: 18px; }
        .status-info { font-size: 18px; font-weight: bold; color: #1c1c1e; background: #f2f2f7; padding: 10px; border-radius: 6px; text-align: center;}
        
        .panel-section { background: #fcfcfd; border: 1px solid #e5e5ea; padding: 12px; border-radius: 8px; }
        .section-title { font-weight: bold; font-size: 13px; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        
        .radio-group { display: flex; gap: 15px; }
        .comment-box {
            width: 100%; height: 110px; box-sizing: border-box; padding: 12px;
            border: 1px solid #c7c7cc; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.4;
        }
        .comment-box:focus { border-color: #007aff; outline: none; }
        
        select { padding: 6px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #c7c7cc; width: 100%; }
        
        .file-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .file-row { display: flex; gap: 10px; width: 100%; }
        .file-input-wrapper { position: relative; flex: 1; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        #printArea { display: none; }
   <!-- ===============================================================-->
        /* 🖨 分割印刷モード用CSS設定 */
        @media print {
            body { 
                background-color: #fff !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }

            /* 画面のタイトル・盤面・右側の操作パネルをすべて確実に隠す */
            h1, 
            p.subtitle, 
            .container, 
            .left-panel, 
            .right-panel { 
                display: none !important; 
            }

            /* 印刷用エリア（50手ごとの棋譜）だけを表示する */
            #printArea { 
                display: block !important; 
                visibility: visible !important;
                position: static !important;
                width: 100% !important;
            }

            .print-layout {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }
            .print-item {
                break-inside: avoid;
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 1px solid #ddd;
                padding: 10px;
                border-radius: 6px;
            }
            .print-title {
                font-size: 15px;
                font-weight: bold;
                margin-bottom: 8px;
                color: #000;
            }
            .print-board-outer {
                width: 300px !important;
                height: 300px !important;
                border: 2px solid #6e4e03 !important;
                background-color: #dcbc7c !important;
                position: relative !important;
                display: block !important;
            }
            .print-comment {
                width: 300px;
                font-size: 12px;
                margin-top: 8px;
                color: #000;
                line-height: 1.4;
                text-align: left;
            }
        }

    </style>
</head>
<body>

    <h1>囲碁・棋譜並べ＆解説作成ジェネレーター</h1>
    <p class="subtitle">最新手番号のみ表示・アゲハマ対応・無限手数・両面分割印刷対応</p>

    <div class="container">
        <div class="left-panel">
            <div class="board-container-outer">
                <div class="board-wrapper view-all" id="boardWrapper">
                    <div class="labels-row top" id="labelsTop"></div>
                    <div class="labels-row bottom" id="labelsBottom"></div>
                    <div class="labels-col left" id="labelsLeft"></div>

                    <div class="labels-col right" id="labelsRight"></div>
                    <div class="board-main">
                        <div class="board-grid" id="boardGrid"></div>
                    </div>
                </div>
            </div>
            <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
            <div class="controls">
                <button id="btnPrev">← 前の手</button>
                <button id="btnPlay">自動再生</button>
                <button id="btnNext">次の手 →</button>
                <button id="btnClear" style="background-color:#8e8e93;">全クリア</button>
            </div>
        </div>
   <!-- ===============================================================-->
        <!-- 右パネル：各種設定と解説入力（機能拡張版） -->
        <div class="right-panel">
            <div class="status-info" id="statusInfo">現在の手数: 0 手目</div>
            
            <!-- 👁️ 盤面範囲切り替え -->
            <div class="panel-section">
                <div class="section-title">盤面の表示範囲</div>
                <select id="selectView">
                    <option value="view-all">盤面全体 (19路盤総譜用)</option>
                    <option value="view-tr">右上隅</option>
                    <option value="view-tl">左上隅</option>
                    <option value="view-br">右下隅</option>
                    <option value="view-bl">左下隅</option>
                </select>
            </div>

            <!-- ⏱️ 【新機能】自動再生の速度調節スライダー -->
            <div class="panel-section">
                <div class="section-title">自動再生の速度：<span id="speedDisplay">10</span> 秒 / 1手</div>
                <input type="range" id="inputSpeed" min="1" max="10" value="10" style="width: 100%; cursor: pointer;">
            </div>

            <!-- ☖ 手番と新機能ボタン -->
            <div class="panel-section">
                <div class="section-title">手番の設定</div>
                <div class="radio-group" style="margin-bottom: 10px;">
                    <label><input type="radio" id="colorBlack" name="stoneColor" value="B" checked> <b>黒番</b></label>
                    <label><input type="radio" id="colorWhite" name="stoneColor" value="W"> <b>白番</b></label>
                </div>
                <!-- 💡 【新機能】ここからの手順を黒1からスタートさせるボタン -->
                <button id="btnResetToFirst" style="background-color: #ff9500; width: 100%; font-size: 13px; padding: 6px 10px;">🔄 現在の局面から黒1番で並べる</button>
            </div>

            <!-- 📝 解説入力 -->
            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column;">
                <div class="section-title">この局面（手数）の解説・メモ</div>
                <textarea class="comment-box" id="commentBox" placeholder="ここに解説を入力してください..."></textarea>
            </div>
            
            <!-- 💾 ファイル操作・印刷ボタン類 -->
            <div class="file-buttons">
                <div class="file-row">
                    <div class="file-input-wrapper">
                        <button style="background-color:#34c759; width:100%;">SGF読込</button>
                        <input type="file" id="fileImport" accept=".sgf">
                    </div>
                    <!-- 💡 【新機能】名前をつけて保存に変更 -->
                    <button id="btnExport" style="background-color:#5856d6; flex: 1;">名前をつけて保存</button>
                </div>
                <button id="btnPrint" style="background-color:#e07a5f; width:100%;">🖨 棋譜の分割印刷 (A4両面最適化)</button>
                <button id="btnHelpExport" style="background-color:#107c41; width:100%;">📄 説明書保存</button>
            </div>
        </div>

   <!-- ===============================================================-->
    <!-- 印刷用テンポラリエリア -->
    <div id="printArea"></div>
    <script>
        let autoplayTime = 10000; // 初期値：10秒（10000ミリ秒）
        const SGF_CHARS = "abcdefghijklmnopqrs";
        const LETTER_LABELS = Array.of("A","B","C","D","E","F","G","H","J","K","L","M","N","O","P","Q","R","S","T");
        const HOSHI_COORDS = Array.of(3, 9, 15);

        let moves = new Array();
        let currentHand = 0;
        let isPlaying = false, timerId = null, timerStart = 0, progressIntervalId = null;

        const boardWrapper = document.getElementById('boardWrapper'), boardGrid = document.getElementById('boardGrid');
        const statusInfo = document.getElementById('statusInfo'), commentBox = document.getElementById('commentBox'), timerProgress = document.getElementById('timerProgress');
        const btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext'), btnPlay = document.getElementById('btnPlay'), btnClear = document.getElementById('btnClear');
        const btnExport = document.getElementById('btnExport'), fileImport = document.getElementById('fileImport'), selectView = document.getElementById('selectView'), btnHelpExport = document.getElementById('btnHelpExport'), btnPrint = document.getElementById('btnPrint'), printArea = document.getElementById('printArea');
        const labelsTop = document.getElementById('labelsTop'), labelsBottom = document.getElementById('labelsBottom'), labelsLeft = document.getElementById('labelsLeft'), labelsRight = document.getElementById('labelsRight');
        
        // 新機能用の要素取得
        const inputSpeed = document.getElementById('inputSpeed');
        const speedDisplay = document.getElementById('speedDisplay');
        const btnResetToFirst = document.getElementById('btnResetToFirst');

        // 1. 碁盤（19路の交差点と星）の生成
        function initBoard() {
            boardGrid.innerHTML = '';
            // 18×18のグリッドセルを作り、四隅の交差点を19×19分制御します
            for (let y = 0; y < 18; y++) {
                for (let x = 0; x < 18; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'intersection';

                    // 左上の交差点（0〜17, 0〜17）を作成
                    createIntersectionTarget(cell, x, y, 'target-tl');
                    // 一番右端の列の場合、右上の交差点（18, y）を追加
                    if (x === 17) createIntersectionTarget(cell, 18, y, 'target-tr');
                    // 一番下端の行の場合、左下の交差点（x, 18）を追加
                    if (y === 17) createIntersectionTarget(cell, x, 18, 'target-bl');
                    // 右下の隅（18, 18）を追加
                    if (x === 17 && y === 17) createIntersectionTarget(cell, 18, 18, 'target-br');

                    boardGrid.appendChild(cell);
                }
            }

            labelsTop.innerHTML = ''; labelsBottom.innerHTML = ''; labelsLeft.innerHTML = ''; labelsRight.innerHTML = '';
            for (let i = 0; i < 19; i++) {
                let t = document.createElement('span'); t.textContent = LETTER_LABELS.at(i); labelsTop.appendChild(t);
                let b = document.createElement('span'); b.textContent = LETTER_LABELS.at(i); labelsBottom.appendChild(b);
                let l = document.createElement('span'); l.textContent = 19 - i; labelsLeft.appendChild(l);
                let r = document.createElement('span'); r.textContent = 19 - i; labelsRight.appendChild(r);
            }
            render();
        }

        // 各交差点のターゲット（クリック判定＋星マーク）を生成する補助関数
        function createIntersectionTarget(parentCell, x, y, posClass) {
            const target = document.createElement('div');
            target.className = 'click-target ' + posClass;
            target.dataset.x = x;
            target.dataset.y = y;

            if (HOSHI_COORDS.includes(x) && HOSHI_COORDS.includes(y)) {
                const dot = document.createElement('div');
                dot.className = 'hoshi-dot';
                // targetの中心に星を合わせるため調整
                dot.style.top = '50%';
                dot.style.left = '50%';
                dot.style.transform = 'translate(-50%, -50%)';
                target.appendChild(dot);
            }

            target.addEventListener('click', onIntersectionClick);
            parentCell.appendChild(target);
        }

        // 2. 着手および抜き跡（アゲハマ）処理
        function onIntersectionClick(e) {
            e.stopPropagation();
            if (isPlaying) stopAutoPlay();
            const x = parseInt(this.dataset.x), y = parseInt(this.dataset.y);
            const currentBoardStones = getBoardStateAt(currentHand);
            const existingStone = currentBoardStones.find(s => s.x === x && s.y === y);
            
            if (currentHand < moves.length) { moves = moves.slice(0, currentHand); }

            if (existingStone) {
                moves.push({ x: x, y: y, color: existingStone.color, comment: "石の抜き跡", isRemove: true, isSetup: false });
            } else {
                const color = document.querySelector('input[name="stoneColor"]:checked').value;
                moves.push({ x: x, y: y, color: color, comment: "", isRemove: false, isSetup: false });
                
                if (color === 'B') { document.getElementById('colorWhite').checked = true; }
                else { document.getElementById('colorBlack').checked = true; }
            }
            currentHand = moves.length; render();
        }

        // 【新機能】現在の盤面の石を「問題図（番号なし）」として固定し、次の手から黒番1手目としてスタートする
        btnResetToFirst.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay();
            const currentStones = getBoardStateAt(currentHand);
            if (currentStones.length === 0) {
                alert("盤面に石が置かれていません。先に問題図（配置）を作成してください。");
                return;
            }
            if (!confirm("現在の盤面を『問題図（番号なし）』として固定し、次の一手から黒1番としてスタートしますか？")) return;

            // 現在の石をすべて「初期配置石（isSetup: true）」として新しい履歴を作り直す
            moves = new Array();
            currentStones.forEach(s => {
                moves.push({ x: s.x, y: s.y, color: s.color, comment: "", isRemove: false, isSetup: true });
            });
            currentHand = moves.length;
            
            // 手番を黒にリセット
            document.getElementById('colorBlack').checked = true;
            render();
        });

        // 指定手数時点の盤面計算（初期配置石の番号はカウントしない）
        function getBoardStateAt(hand) {
            let activeStones = new Array();
            let moveCount = 0; // 実際の着手番号のカウント

            for (let i = 0; i < hand; i++) {
                const m = moves.at(i);
                if (m.isRemove) {
                    activeStones = activeStones.filter(s => !(s.x === m.x && s.y === m.y));
                } else {
                    if (m.isSetup) {
                        // 問題図の石（番号なし）
                        activeStones.push({ x: m.x, y: m.y, color: m.color, moveNumber: 0, isSetup: true });
                    } else {
                        moveCount++;
                        activeStones.push({ x: m.x, y: m.y, color: m.color, moveNumber: moveCount, isSetup: false });
                    }
                }
            }
            return activeStones;
        }
        // 3. 画面の再描画（レンダリング）処理
        function render() {
            boardGrid.querySelectorAll('.stone').forEach(s => s.remove());
            
            const currentStones = getBoardStateAt(currentHand);
            let latestMoveNumber = 0;

            currentStones.forEach((stone) => {
                const target = boardGrid.querySelector('.click-target[data-x="' + stone.x + '"][data-y="' + stone.y + '"]');
                if (target) {
                    const d = document.createElement('div');
                    // 問題図（初期配置石）以外で、現在の手数に一致するものを最新手とする
                    const isLatest = (!stone.isSetup && stone.moveNumber > 0 && iIsLatestMove(stone, currentStones));
                    
                    d.className = 'stone ' + (stone.color === 'B' ? 'black' : 'white') + (isLatest ? ' latest' : '');
                    // 交差点（targetの中心）に石の中心を合わせる
                    d.style.top = '50%';
                    d.style.left = '50%';

                    d.style.transform = 'translate(-50%, -50%)';

                    if (isLatest) {
                        d.textContent = stone.moveNumber;
                        latestMoveNumber = stone.moveNumber;
                    }
                    target.appendChild(d);
                }
            });

            const actualMovesCount = currentStones.filter(s => !s.isSetup).length;
            statusInfo.textContent = "現在の手数: " + actualMovesCount + " 手目";

            if (currentHand > 0) {
                commentBox.value = moves.at(currentHand - 1).comment || "";
                commentBox.disabled = false;
            } else {
                commentBox.value = "";
                commentBox.disabled = true;
            }
        }

        function iIsLatestMove(targetStone, allStones) {
            let maxNum = 0;
            allStones.forEach(s => {
                if (!s.isSetup && s.moveNumber > maxNum) maxNum = s.moveNumber;
            });
            return targetStone.moveNumber === maxNum;
        }

        commentBox.addEventListener('input', () => {
            if (currentHand > 0) moves.at(currentHand - 1).comment = commentBox.value;
        });

        selectView.addEventListener('change', () => {
            boardWrapper.className = 'board-wrapper ' + selectView.value;
        });

        // 4. 自動再生の速度調節スライダー連動
        inputSpeed.addEventListener('input', () => {
            const sec = parseInt(inputSpeed.value);
            speedDisplay.textContent = sec;
            autoplayTime = sec * 1000;
        });

        btnPrev.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay();
            if (currentHand > 0) { currentHand--; render(); }
        });

        btnNext.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay();
            if (currentHand < moves.length) { currentHand++; render(); }
        });

        btnClear.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay();
            if (confirm("すべての棋譜データをクリアしますか？")) {
                moves = new Array(); currentHand = 0; render();
            }
        });

        // 5. 自動再生ロジック
        btnPlay.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay(); else startAutoPlay();
        });

        function startAutoPlay() {
            if (currentHand >= moves.length) currentHand = 0;
            isPlaying = true;
            btnPlay.textContent = "再生停止";
            btnPlay.classList.add('stop');
            timerStart = Date.now();
            runAutoPlayStep();
        }

        function runAutoPlayStep() {
            if (!isPlaying) return;
            if (currentHand < moves.length) {
                currentHand++;
                render();
                timerStart = Date.now();
                updateProgressBar();
                timerId = setTimeout(runAutoPlayStep, autoplayTime);
            } else {
                stopAutoPlay();
            }
        }

        function stopAutoPlay() {
            isPlaying = false;
            btnPlay.textContent = "自動再生";
            btnPlay.classList.remove('stop');
            clearTimeout(timerId);
            clearInterval(progressIntervalId);
            timerProgress.style.width = "0%";
        }

        function updateProgressBar() {
            clearInterval(progressIntervalId);
            progressIntervalId = setInterval(() => {
                if (!isPlaying) return;
                const p = Math.min(((Date.now() - timerStart) / autoplayTime) * 100, 100);
                timerProgress.style.width = p + "%";
            }, 50);
        }

        // 6. 【新機能】名前をつけて保存（SGFエクスポート）
        btnExport.addEventListener('click', () => {
            if (moves.length === 0) return alert("保存する棋譜データがありません。");

            const defaultName = "kifu_" + new Date().toISOString().slice(0, 10);
            let fileName = prompt("保存するファイル名を入力してください（拡張子 .sgf は自動で付きます）：", defaultName);
            
            if (fileName === null) return;
            fileName = fileName.trim() || defaultName;
            if (!fileName.toLowerCase().endsWith(".sgf")) {
                fileName += ".sgf";
            }

            let txt = "(;GM[1]FF[4]CA[UTF-8]AP[GoBoardGenerator]SZ[19]\n";
            moves.forEach(m => {
                let x = SGF_CHARS.charAt(m.x);
                let y = SGF_CHARS.charAt(m.y);
                if (m.isSetup) {
                    txt += (m.color === 'B' ? "AB[" : "AW[") + x + y + "]";
                } else if (m.isRemove) {
                    txt += ";AE[" + x + y + "]";
                } else {
                    txt += ";" + m.color + "[" + x + y + "]";
                }
                if (m.comment) {
                    txt += "C[" + m.comment.replace(/]/g, '\\]') + "]";
                }
                txt += "\n";
            });
            downloadFile(txt + ")", fileName, "text/plain");
        });

        btnHelpExport.addEventListener('click', () => {
            const helpText = "【囲碁・棋譜並べ＆解説作成ジェネレーター 使用説明書】\n\n" +
                "1. 盤面の交差点をクリックすると石が置かれます。\n" +
                "2. 「現在の局面から黒1番で並べる」を押すと、そこまでの石を問題図として固定し、次の1手から黒1番として番号を振れます。\n" +
                "3. スライダーで自動再生の速度（1秒〜10秒）を自由に調節できます。\n" +
                "4. 「名前をつけて保存」で好きなファイル名を指定してSGF形式で保存できます。\n" +
                "5. 「棋譜の分割印刷」でA4両面印刷に対応したレイアウトで出力できます。";
            downloadFile(helpText, "readme.txt", "text/plain");
        });

        function downloadFile(content, fileName, contentType) {
            const a = document.createElement("a");
            const blob = new Blob([content], { type: contentType });
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // 7. SGF読み込み（初期配置石 AB/AW にも対応）
        fileImport.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const reader = new FileReader();
            reader.onload = function(evt) { parseSGF(evt.target.result); };
            reader.readAsText(files.item(0));
        });

        function parseSGF(sgf) {
            moves = new Array();
            currentHand = 0;

            const setupRegex = /(AB|AW)((?:\[[a-s]{2}\])+)/g;
            let sMatch;
            while ((sMatch = setupRegex.exec(sgf)) !== null) {
                const color = (sMatch.at(1) === 'AB') ? 'B' : 'W';
                const coordsBlock = sMatch.at(2);
                const coordRegex = /\[([a-s]{2})\]/g;
                let cMatch;
                while ((cMatch = coordRegex.exec(coordsBlock)) !== null) {
                    const c = cMatch.at(1);
                    const x = SGF_CHARS.indexOf(c.charAt(0));
                    const y = SGF_CHARS.indexOf(c.charAt(1));
                    if (x !== -1 && y !== -1) {
                        moves.push({ x: x, y: y, color: color, comment: "", isRemove: false, isSetup: true });
                    }
                }
            }

            const moveRegex = /;(B|W|AE)\[([a-s]{2})\](?:C\[([\s\S]*?)\])?/g;
            let mMatch;
            while ((mMatch = moveRegex.exec(sgf)) !== null) {
                const type = mMatch.at(1);
                const c = mMatch.at(2);
                const comment = mMatch.at(3) || "";
                const x = SGF_CHARS.indexOf(c.charAt(0));
                const y = SGF_CHARS.indexOf(c.charAt(1));
                if (x !== -1 && y !== -1) {
                    moves.push({
                        x: x, y: y,
                        color: (type === 'AE') ? 'B' : type,
                        comment: comment,
                        isRemove: (type === 'AE'),
                        isSetup: false
                    });
                }
            }

            if (moves.length > 0) {
                currentHand = moves.length;
                render();
                alert(moves.length + "個の石データ（問題図・着手）を読み込みました！");
            } else {
                alert("SGFの読み込みに失敗しました。有効なデータが見つかりません。");
            }
        }

        // 8. 🖨 分割印刷処理（A4サイズ両面・50手ごと出力）
        btnPrint.addEventListener('click', () => {
            if (moves.length === 0) return alert("印刷する棋譜データがありません。");
            
             // ★追加1：印刷する直前に、邪魔な操作パネルとタイトルを強制的に隠す
            document.querySelector('.container').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.subtitle').style.display = 'none';
            document.querySelector('.right-panel').style.display = 'none';

            printArea.innerHTML = '';
            const layout = document.createElement('div');
            layout.className = 'print-layout';

            const setupCount = moves.filter(m => m.isSetup).length;
            const actualTotalMoves = moves.length - setupCount;
            const step = 50;
            const loopMax = Math.max(actualTotalMoves, 1);

            for (let mCount = step; mCount <= loopMax || mCount === step; mCount += step) {
                const targetMoveNum = Math.min(mCount, actualTotalMoves);
                const targetHandIndex = setupCount + targetMoveNum;

                const item = document.createElement('div');
                item.className = 'print-item';

                const title = document.createElement('div');
                title.className = 'print-title';
                if (actualTotalMoves === 0) {
                    title.textContent = "問題図（初期配置）";
                } else {
                    const startNum = Math.max(1, targetMoveNum - step + 1);
                    title.textContent = `${startNum}手目 ～ ${targetMoveNum}手目`;
                }
                item.appendChild(title);

                const outer = document.createElement('div');
                outer.className = 'print-board-outer';

                const grid = document.createElement('div');
                grid.className = 'board-grid';

                for (let y = 0; y < 18; y++) {
                    for (let x = 0; x < 18; x++) {
                        const cell = document.createElement('div');
                        cell.className = 'intersection';
                        createPrintTarget(cell, x, y, 'target-tl');
                        if (x === 17) createPrintTarget(cell, 18, y, 'target-tr');
                        if (y === 17) createPrintTarget(cell, x, 18, 'target-bl');
                        if (x === 17 && y === 17) createPrintTarget(cell, 18, 18, 'target-br');
                        grid.appendChild(cell);
                    }
                }
                outer.appendChild(grid);

                const stonesAtHand = getBoardStateAt(targetHandIndex);
                stonesAtHand.forEach(stone => {
                    const target = grid.querySelector('.click-target[data-x="' + stone.x + '"][data-y="' + stone.y + '"]');
                    if (target) {
                        const d = document.createElement('div');
                        const isLatest = (!stone.isSetup && stone.moveNumber === targetMoveNum);
                        d.className = 'stone ' + (stone.color === 'B' ? 'black' : 'white') + (isLatest ? ' latest' : '');
                        d.style.top = '50%';
                        d.style.left = '50%';
                        d.style.transform = 'translate(-50%, -50%)';
                        if (isLatest) d.textContent = stone.moveNumber;
                        target.appendChild(d);
                    }
                });
                item.appendChild(outer);

                const comm = document.createElement('div');
                comm.className = 'print-comment';
                const lastComment = (targetHandIndex > 0 && moves.at(targetHandIndex - 1).comment) ? moves.at(targetHandIndex - 1).comment : "（解説なし）";
                comm.innerHTML = `<strong>【解説】</strong><br>${lastComment.replace(/\n/g, '<br>')}`;
                item.appendChild(comm);

                layout.appendChild(item);
                if (targetMoveNum >= actualTotalMoves) break;
            }
printArea.appendChild(layout);
// ★追加：CSSの隠す設定を無視して、強制的に印刷用エリアを表示する
printArea.style.display = 'block';

setTimeout(() => { 
    window.print(); 

    // ★追加：印刷が終わったら印刷用エリアを再び隠し、元の操作画面を戻す
    printArea.style.display = 'none';
    document.querySelector('.container').style.display = 'flex';
    document.querySelector('h1').style.display = 'block';
    document.querySelector('.subtitle').style.display = 'block';
    document.querySelector('.right-panel').style.display = 'flex';
}, 500);


        });


        function createPrintTarget(parentCell, x, y, posClass) {
            const target = document.createElement('div');
            target.className = 'click-target ' + posClass;
            target.dataset.x = x;
            target.dataset.y = y;
            if (HOSHI_COORDS.includes(x) && HOSHI_COORDS.includes(y)) {
                const dot = document.createElement('div');
                dot.className = 'hoshi-dot';
                dot.style.top = '50%';
                dot.style.left = '50%';
                dot.style.transform = 'translate(-50%, -50%)';
                target.appendChild(dot);
            }
            parentCell.appendChild(target);
        }

        // 9. 初期起動イベント
        window.addEventListener('DOMContentLoaded', initBoard);
    </script>
