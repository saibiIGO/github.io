<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>囲碁・棋譜並べ＆解説作成ジェネレーター（完成版）</title>
    <style>
        :root {
            --board-color: #dcbc7c;
            --line-color: #000000;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #1a1a1a; margin-bottom: 5px; font-size: 22px; }
        p.subtitle { color: #666; margin: 0 0 20px 0; font-size: 13px; }
        
        .container {
            display: flex;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 碁盤の最も外側の木枠（茶色い縁） */
        .board-container-outer {
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 4px solid #6e4e03;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            background-color: var(--board-color);
        }
        
        .board-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--board-color);
            transform-origin: top left;
            transition: transform 0.3s ease;
        }
        
        .view-all { transform: scale(1) translate(0, 0); }
        .view-tr  { transform: scale(2.1) translate(-52.3%, 0); }
        .view-tl  { transform: scale(2.1) translate(0, 0); }
        .view-br  { transform: scale(2.1) translate(-52.3%, -52.3%); }
        .view-bl  { transform: scale(2.1) translate(0, -52.3%); }

        /* 碁盤の19路の線が走るエリア（周囲に均等な「外べり」を確保） */
        .board-main {
            position: absolute;
            top: 6.5%; 
            left: 6.5%; 
            width: 87%; 
            height: 87%;
            box-sizing: border-box;
        }

        /* 18マス×18マスの格子状に並べ、セルの右側と下側に線を引きます */
        .board-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-rows: repeat(18, 1fr);
            border-top: 1px solid var(--line-color);    /* 1路（一番上の外周線） */
            border-left: 1px solid var(--line-color);   /* 1路（一番左の外周線） */
            box-sizing: border-box;
        }
        
        /* 碁盤を構成するマス目の定義（右と下に線を引くことで綺麗な格子になります） */
        .intersection {
            position: relative;
            border-right: 1px solid var(--line-color);  /* 縦線 */
            border-bottom: 1px solid var(--line-color); /* 横線 */
            box-sizing: border-box;
        }

        /* 碁石を「格子線の交差点」にジャストフィットさせるための、透明なクリック判定エリア */
        .click-target {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 5;
        }
        /* 交差点（マスの角）を中心にずらすための調整 */
        .target-tl { top: -50%; left: -50%; }
        .target-tr { top: -50%; left: 50%; }
        .target-bl { top: 50%; left: -50%; }
        .target-br { top: 50%; left: 50%; }
        
        /* 星（黒いドット）の位置固定 */
        .hoshi-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--line-color);
            border-radius: 50%;
            z-index: 2;
            top: -3px;
            left: -3px;
            pointer-events: none;
        }

        /* 碁石のデザイン：交差点の真上に完璧に中心を合わせます */
        .stone {
            position: absolute; 
            width: 92%; 
            height: 92%;
            border-radius: 50%; 
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 11px; user-select: none;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            top: -46%;
            left: -46%;
        }
        .stone.black { background: radial-gradient(circle at 30% 30%, #444, #000); color: #ffffff; }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #dbdbdb); color: #000000; border: 1px solid #999; }
        
        .stone.latest::after {
            content: ''; width: 90%; height: 90%; border: 2px solid #ff3b30; border-radius: 50%; position: absolute;
        }

        /* 座標ラベルの位置を交差点と100%完全一致させます */
        .labels-row {
            position: absolute; 
            left: 6.5%; 
            width: 87%; 
            height: 6.5%;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: bold; color: #444; user-select: none;
        }
        .labels-row.top { top: 0.5%; }
        .labels-row.bottom { bottom: 0.5%; }

        .labels-col {
            position: absolute; 
            top: 6.5%; 
            height: 87%; 
            width: 6.5%;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: bold; color: #444; user-select: none;
        }
        .labels-col.left { left: 0.5%; }
        .labels-col.right { right: 0.5%; }

        .labels-row span {
    display: flex; align-items: center; justify-content: center; width: 0; height: 24px; overflow: visible;
        }
.labels-col span {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 0; overflow: visible;
        }
 
        .timer-bar {
            width: 100%; max-width: 520px; height: 6px; background-color: #e5e5ea;
            margin-top: 12px; border-radius: 3px; overflow: hidden;
        }
        .timer-progress { width: 0%; height: 100%; background-color: #34c759; transition: width 0.1s linear; }
        
        .controls { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 10px 18px; font-size: 14px; border: none; border-radius: 6px;
            background-color: #007aff; color: white; cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #d1d1d6; cursor: not-allowed; }
        button.stop { background-color: #ff3b30; }
        button.stop:hover { background-color: #c72c22; }

        .right-panel { width: 380px; display: flex; flex-direction: column; gap: 18px; }
        .status-info { font-size: 18px; font-weight: bold; color: #1c1c1e; background: #f2f2f7; padding: 10px; border-radius: 6px; text-align: center;}
        
        .panel-section { background: #fcfcfd; border: 1px solid #e5e5ea; padding: 12px; border-radius: 8px; }
        .section-title { font-weight: bold; font-size: 13px; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        
        .radio-group { display: flex; gap: 15px; }
        .comment-box {
            width: 100%; height: 110px; box-sizing: border-box; padding: 12px;
            border: 1px solid #c7c7cc; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.4;
        }
        .comment-box:focus { border-color: #007aff; outline: none; }
        
        select { padding: 6px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #c7c7cc; width: 100%; }
        
        .file-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .file-row { display: flex; gap: 10px; width: 100%; }
        .file-input-wrapper { position: relative; flex: 1; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        #printArea { display: none; }

        /* 🖨 分割印刷モード用CSS設定 */
        @media print {
            body { 
                background-color: #fff !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }

            /* 画面のタイトル・盤面・右側の操作パネルをすべて確実に隠す */
            h1, 
            p.subtitle, 
            .container, 
            .left-panel, 
            .right-panel { 
                display: none !important; 
            }

            /* 印刷用エリア（50手ごとの棋譜）だけを表示する */
            #printArea { 
                display: block !important; 
                visibility: visible !important;
                position: static !important;
                width: 100% !important;
            }

            .print-layout {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }
            .print-item {
                break-inside: avoid;
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 1px solid #ddd;
                padding: 10px;
                border-radius: 6px;
            }
            .print-title {
                font-size: 15px;
                font-weight: bold;
                margin-bottom: 8px;
                color: #000;
            }
            .print-board-outer {
                width: 300px !important;
                height: 300px !important;
                border: 2px solid #6e4e03 !important;
                background-color: #dcbc7c !important;
                position: relative !important;
                display: block !important;
            }
            .print-comment {
                width: 300px;
                font-size: 12px;
                margin-top: 8px;
                color: #000;
                line-height: 1.4;
                text-align: left;
            }
        }

    </style>
</head>
<body>

    <h1>囲碁・棋譜並べ＆解説作成ジェネレーター</h1>
    <p class="subtitle">最新手番号のみ表示・アゲハマ対応・無限手数・両面分割印刷対応</p>

    <div class="container">
        <div class="left-panel">
            <div class="board-container-outer">
                <div class="board-wrapper view-all" id="boardWrapper">
                    <div class="labels-row top" id="labelsTop"></div>
                    <div class="labels-row bottom" id="labelsBottom"></div>
                    <div class="labels-col left" id="labelsLeft"></div>

                    <div class="labels-col right" id="labelsRight"></div>
                    <div class="board-main">
                        <div class="board-grid" id="boardGrid"></div>
                    </div>
                </div>
            </div>
            <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
            <div class="controls">
                <button id="btnPrev">← 前の手</button>
                <button id="btnPlay">自動再生</button>
                <button id="btnNext">次の手 →</button>
                <button id="btnClear" style="background-color:#8e8e93;">全クリア</button>
            </div>
        </div>
   <!-- ===============================================================-->
        <!-- 右パネル：各種設定と解説入力（機能拡張版） -->
        <div class="right-panel">
            <div class="status-info" id="statusInfo">現在の手数: 0 手目</div>
            
            <!-- 👁️ 盤面範囲切り替え -->
            <div class="panel-section">
                <div class="section-title">盤面の表示範囲</div>
                <select id="selectView">
                    <option value="view-all">盤面全体 (19路盤総譜用)</option>
                    <option value="view-tr">右上隅</option>
                    <option value="view-tl">左上隅</option>
                    <option value="view-br">右下隅</option>
                    <option value="view-bl">左下隅</option>
                </select>
      <div style="margin-top: 8px;">
                <label style="font-size: 13px; font-weight: bold; color: #333;">手数（数字）の表示：</label>
                <select id="selectNumberMode" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin-top: 4px;">
                    <option value="latest">最新の手のみ数字を表示</option>
                    <option value="all">すべての石に数字を表示</option>
                    <option value="none">数字を表示しない</option>
                </select>
            </div>
            <div style="margin-top: 8px;">
                <label style="font-size: 13px; font-weight: bold; color: #333;">盤面サイズ：</label>
                <select id="selectBoardSize" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin-top: 4px;">
                    <option value="19" selected>19路盤（標準）</option>
                    <option value="13">13路盤（中盤・詰碁用）</option>
                    <option value="9">9路盤（入門・詰碁用）</option>
                </select>
            </div>

            </div>

            <!-- ⏱️ 【新機能】自動再生の速度調節スライダー -->
            <div class="panel-section">
                <div class="section-title">自動再生の速度：<span id="speedDisplay">10</span> 秒 / 1手</div>
                <input type="range" id="inputSpeed" min="1" max="10" value="10" style="width: 100%; cursor: pointer;">
            </div>

            <!-- ☖ 手番と新機能ボタン -->
            <div class="panel-section">
                <div class="section-title">手番の設定</div>
                <div class="radio-group" style="margin-bottom: 10px;">
                    <label><input type="radio" id="colorBlack" name="stoneColor" value="B" checked> <b>黒番</b></label>
                    <label><input type="radio" id="colorWhite" name="stoneColor" value="W"> <b>白番</b></label>
                </div>
                <!-- 💡 【新機能】ここからの手順を黒1からスタートさせるボタン -->
                <button id="btnResetToFirst" style="background-color: #ff9500; width: 100%; font-size: 13px; padding: 6px 10px;">🔄 現在の局面から黒1番で並べる</button>
            </div>

            <!-- 📝 解説入力 -->
            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column;">
                <div class="section-title">この局面（手数）の解説・メモ</div>
                <textarea class="comment-box" id="commentBox" placeholder="ここに解説を入力してください..."></textarea>
            </div>
            
            <!-- 💾 ファイル操作・印刷ボタン類 -->
            <div class="file-buttons">
                <div class="file-row">
                    <div class="file-input-wrapper">
                        <button style="background-color:#34c759; width:100%;">SGF読込</button>
                        <input type="file" id="fileImport" accept=".sgf">
                    </div>
                    <!-- 💡 【新機能】名前をつけて保存に変更 -->
                    <button id="btnExport" style="background-color:#5856d6; flex: 1;">名前をつけて保存</button>
                </div>
                <button id="btnPrint" style="background-color:#e07a5f; width:100%;">🖨 棋譜の分割印刷 (A4両面最適化)</button>
                <button id="btnHelpExport" style="background-color:#107c41; width:100%;">📄 説明書保存</button>
            </div>
        </div>

   <!-- ===============================================================-->
    <!-- 印刷用テンポラリエリア -->
    <div id="printArea"></div>
    <script>
            let autoplayTime = 10000; // 初期値：10秒（10000ミリ秒）
        let boardSize = 19;       // 現在の盤面サイズ（19, 13, 9）
        const SGF_CHARS = "abcdefghijklmnopqrs";
        const ALL_LETTER_LABELS = Array.of("A","B","C","D","E","F","G","H","J","K","L","M","N","O","P","Q","R","S","T");

        let moves = new Array();
        let currentHand = 0;
        let isPlaying = false, timerId = null, timerStart = 0, progressIntervalId = null;

        const boardWrapper = document.getElementById('boardWrapper'), boardGrid = document.getElementById('boardGrid');
        const statusInfo = document.getElementById('statusInfo'), commentBox = document.getElementById('commentBox'), timerProgress = document.getElementById('timerProgress');
        const btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext'), btnPlay = document.getElementById('btnPlay'), btnClear = document.getElementById('btnClear');
        const btnExport = document.getElementById('btnExport'), fileImport = document.getElementById('fileImport'), selectView = document.getElementById('selectView'), btnHelpExport = document.getElementById('btnHelpExport'), btnPrint = document.getElementById('btnPrint'), printArea = document.getElementById('printArea');
        const labelsTop = document.getElementById('labelsTop'), labelsBottom = document.getElementById('labelsBottom'), labelsLeft = document.getElementById('labelsLeft'), labelsRight = document.getElementById('labelsRight');
        
        // 新機能用の要素取得
        const inputSpeed = document.getElementById('inputSpeed');
        const speedDisplay = document.getElementById('speedDisplay');
        const btnResetToFirst = document.getElementById('btnResetToFirst');
        const selectBoardSize = document.getElementById('selectBoardSize');

        // 盤面サイズごとの星（ホシ）の座標リストを返す関数
        function getHoshiCoords(size) {
            if (size === 19) return Array.of(3, 9, 15);
            if (size === 13) return Array.of(3, 6, 9);
            if (size === 9)  return Array.of(2, 4, 6);
            return Array.of();
        }

        // 1. 碁盤（指定された路数の交差点と星）の生成
        function initBoard() {
            boardGrid.innerHTML = '';
            const cellsCount = boardSize - 1; // 19路なら18マス、13路なら12マス、9路なら8マス

            // グリッドの列と行の数を動的に変更
            boardGrid.style.gridTemplateColumns = `repeat(${cellsCount}, 1fr)`;
            boardGrid.style.gridTemplateRows = `repeat(${cellsCount}, 1fr)`;

            for (let y = 0; y < cellsCount; y++) {
                for (let x = 0; x < cellsCount; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'intersection';

                    // 左上の交差点
                    createIntersectionTarget(cell, x, y, 'target-tl');
                    // 一番右端の列の場合
                    if (x === cellsCount - 1) createIntersectionTarget(cell, cellsCount, y, 'target-tr');
                    // 一番下端の行の場合
                    if (y === cellsCount - 1) createIntersectionTarget(cell, x, cellsCount, 'target-bl');
                    // 右下の隅
                    if (x === cellsCount - 1 && y === cellsCount - 1) createIntersectionTarget(cell, cellsCount, cellsCount, 'target-br');

                    boardGrid.appendChild(cell);
                }
            }

            // 座標ラベル（A〜T、19〜1）を盤面サイズに合わせて生成
            labelsTop.innerHTML = ''; labelsBottom.innerHTML = ''; labelsLeft.innerHTML = ''; labelsRight.innerHTML = '';
            for (let i = 0; i < boardSize; i++) {
                let t = document.createElement('span'); t.textContent = ALL_LETTER_LABELS.at(i); labelsTop.appendChild(t);
                let b = document.createElement('span'); b.textContent = ALL_LETTER_LABELS.at(i); labelsBottom.appendChild(b);
                let l = document.createElement('span'); l.textContent = boardSize - i; labelsLeft.appendChild(l);
                let r = document.createElement('span'); r.textContent = boardSize - i; labelsRight.appendChild(r);
            }
            render();
        }

        // 各交差点のターゲット（クリック判定＋星マーク）を生成する補助関数
        function createIntersectionTarget(parentCell, x, y, posClass) {
            const target = document.createElement('div');
            target.className = 'click-target ' + posClass;
            target.dataset.x = x;
            target.dataset.y = y;

            const hoshiCoords = getHoshiCoords(boardSize);
            // 9路盤のときは四隅(2,6)と天元(4,4)の5つ、13路・19路は9つの星を表示
            let isHoshi = false;
            if (boardSize === 19) {
                isHoshi = (x === 3 || x === 9 || x === 15) && (y === 3 || y === 9 || y === 15);
            } else if (boardSize === 13) {
                isHoshi = ((x === 3 || x === 9) && (y === 3 || y === 9)) || (x === 6 && y === 6);
            } else if (boardSize === 9) {
                isHoshi = (x === 4 && y === 4);
            }


            if (isHoshi) {
                const dot = document.createElement('div');
                dot.className = 'hoshi-dot';
                dot.style.top = '50%';
                dot.style.left = '50%';
                dot.style.transform = 'translate(-50%, -50%)';
                target.appendChild(dot);
            }

            target.addEventListener('click', onIntersectionClick);
            parentCell.appendChild(target);
        }

    


        // 2. 着手および抜き跡（アゲハマ）処理
        // 2. 着手および自動取り上げ（アゲハマ）処理
        function onIntersectionClick(e) {
            e.stopPropagation();
            if (isPlaying) stopAutoPlay();
            const x = parseInt(this.dataset.x), y = parseInt(this.dataset.y);
            const currentBoardStones = getBoardStateAt(currentHand);
            const existingStone = currentBoardStones.find(s => s.x === x && s.y === y);
            
            if (currentHand < moves.length) { moves = moves.slice(0, currentHand); }

            // すでに石がある場所をクリックした場合は、手動で取り除く（従来の機能も維持）
            if (existingStone) {
                moves.push({ x: x, y: y, color: existingStone.color, comment: "石の抜き跡", isRemove: true, isSetup: false });
            } else {
                const color = document.querySelector('input[name="stoneColor"]:checked').value;
                const opponentColor = (color === 'B') ? 'W' : 'B';

                // 1. まず新しい石を履歴に追加
                moves.push({ x: x, y: y, color: color, comment: "", isRemove: false, isSetup: false });

                // 2. 最新の盤面状態を取得して、隣接する相手の石が取られるか判定
                const updatedStones = getBoardStateAt(moves.length);
                const neighbors = Array.of(
                    { nx: x, ny: y - 1 },
                    { nx: x, ny: y + 1 },
                    { nx: x - 1, ny: y },
                    { nx: x + 1, ny: y }
                );

                let capturedStones = new Array();
                neighbors.forEach(n => {
 
              // 修正前：if (n.nx >= 0 && n.nx < 19 && n.ny >= 0 && n.ny < 19) {  
                    if (n.nx >= 0 && n.nx < 19 && n.ny >= 0 && n.ny < boardSize) {
                        const target = updatedStones.find(s => s.x === n.nx && s.y === n.ny && s.color === opponentColor);
                        if (target) {
                            const groupInfo = checkGroupLiberties(n.nx, n.ny, opponentColor, updatedStones);
                            if (groupInfo.liberties === 0) {
                                groupInfo.group.forEach(gStone => {
                                    if (!capturedStones.some(c => c.x === gStone.x && c.y === gStone.y)) {
                                        capturedStones.push(gStone);
                                    }
                                });
                            }
                        }
                    }
                });

                // 3. 呼吸点がゼロになった相手の石をすべて取り上げる（履歴に抜き跡を追加）
                capturedStones.forEach(cStone => {
                    moves.push({ x: cStone.x, y: cStone.y, color: cStone.color, comment: "", isRemove: true, isSetup: false });
                });

                // 手番を交代
                if (color === 'B') { document.getElementById('colorWhite').checked = true; }
                else { document.getElementById('colorBlack').checked = true; }
            }
            currentHand = moves.length;
            render();
        }

        // 石の連（グループ）と呼吸点（ダメ）の数を調べる関数
        function checkGroupLiberties(startX, startY, color, boardStones) {
            let group = new Array();
            let visited = new Set();
            let liberties = new Set();
            let queue = Array.of({ x: startX, y: startY });

            while (queue.length > 0) {
                const curr = queue.shift();
                const key = curr.x + "," + curr.y;
                if (visited.has(key)) continue;
                visited.add(key);

                const stone = boardStones.find(s => s.x === curr.x && s.y === curr.y);
                if (stone && stone.color === color) {
                    group.push(stone);
                    const dirs = Array.of({ dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 });
                    dirs.forEach(d => {
                        const nx = curr.x + d.dx;
                        const ny = curr.y + d.dy;
                        // 修正前：if (nx >= 0 && nx < 19 && ny >= 0 && ny < 19) {
                        if (nx >= 0 && nx < 19 && ny >= 0 && ny< boardSize) {
                            const neighborStone = boardStones.find(s => s.x === nx && s.y === ny);
                            if (!neighborStone) {
                                liberties.add(nx + "," + ny);
                            } else if (neighborStone.color === color && !visited.has(nx + "," + ny)) {
                                queue.push({ x: nx, y: ny });
                            }
                        }
                    });
                }
            }
            return { group: group, liberties: liberties.size };
        }

        // 【復元】指定手数時点での盤面の石の状態を計算する関数
        function getBoardStateAt(hand) {
            let activeStones = new Array();
            let moveCount = 0;

            for (let i = 0; i < hand; i++) {
                const m = moves.at(i);
                if (m.isRemove) {
                    activeStones = activeStones.filter(s => !(s.x === m.x && s.y === m.y));
                } else {
                    if (m.isSetup) {
                        activeStones.push({ x: m.x, y: m.y, color: m.color, moveNumber: 0, isSetup: true });
                    } else {
                        moveCount++;
                        activeStones.push({ x: m.x, y: m.y, color: m.color, moveNumber: moveCount, isSetup: false });
                    }
                }
            }
            return activeStones;
        }

        // 7. SGF読み込み（初期配置石 AB/AW にも対応）
        fileImport.addEventListener('change', (e) => {

        function parseSGF(sgf) {
 
         // SGF内の盤面サイズ（SZ[9], SZ[13], SZ[19]）を自動検出して切り替え
        const szMatch = /SZ\[(\d+)\]/i.exec(sgf);
        const detectedSize = szMatch ? parseInt(szMatch.at(1), 10) : 19;
        boardSize = (detectedSize === 9 || detectedSize === 13 || detectedSize === 19) ? detectedSize : 19;
        if (selectBoardSize) selectBoardSize.value = boardSize;
        initBoard();

 
            moves = new Array();
            currentHand = 0;

            // 1. 初期配置石（AB[xx], AW[xx]）の抽出
            const setupRegex = /(AB|AW)((?:\s*\[[a-s]{2}\])+)/gi;
            let sMatch;
            while ((sMatch = setupRegex.exec(sgf)) !== null) {
                const color = (sMatch.at(1).toUpperCase() === 'AB') ? 'B' : 'W';
                const coordsBlock = sMatch.at(2);
                const coordRegex = /\[([a-s]{2})\]/gi;
                let cMatch;
                while ((cMatch = coordRegex.exec(coordsBlock)) !== null) {
                    const c = cMatch.at(1).toLowerCase();
                    const x = SGF_CHARS.indexOf(c.charAt(0));
                    const y = SGF_CHARS.indexOf(c.charAt(1));
                    if (x !== -1 && y !== -1) {
                        moves.push({ x: x, y: y, color: color, comment: "", isRemove: false, isSetup: true });
                    }
                }
            }

            // 2. 着手および抜き跡（;B[xx], ;W[xx], ;AE[xx]）の抽出＋アゲハマ自動判定
            const moveRegex = /;\s*(B|W|AE)\s*\[([a-s]{2})\](?:\s*C\[([\s\S]*?)\])?/gi;
            let mMatch;
            while ((mMatch = moveRegex.exec(sgf)) !== null) {
                const type = mMatch.at(1).toUpperCase();
                const c = mMatch.at(2).toLowerCase();
                const comment = mMatch.at(3) || "";
                const x = SGF_CHARS.indexOf(c.charAt(0));
                const y = SGF_CHARS.indexOf(c.charAt(1));
                
                if (x !== -1 && y !== -1) {
                    if (type === 'AE') {
                        moves.push({ x: x, y: y, color: 'B', comment: comment, isRemove: true, isSetup: false });
                    } else {
                        const opponentColor = (type === 'B') ? 'W' : 'B';
                        moves.push({ x: x, y: y, color: type, comment: comment, isRemove: false, isSetup: false });

                        // 1手置くごとに呼吸点（ダメ）がゼロになった相手の石を自動取り上げ
                        const updatedStones = getBoardStateAt(moves.length);
                        const neighbors = Array.of(
                            { nx: x, ny: y - 1 },
                            { nx: x, ny: y + 1 },
                            { nx: x - 1, ny: y },
                            { nx: x + 1, ny: y }
                        );

                        let capturedStones = new Array();
                        neighbors.forEach(n => {
                            if (n.nx >= 0 && n.nx < 19 && n.ny >= 0 && n.ny < 19) {
                                const target = updatedStones.find(s => s.x === n.nx && s.y === n.ny && s.color === opponentColor);
                                if (target) {
                                    const groupInfo = checkGroupLiberties(n.nx, n.ny, opponentColor, updatedStones);
                                    if (groupInfo.liberties === 0) {
                                        groupInfo.group.forEach(gStone => {
                                            if (!capturedStones.some(cStone => cStone.x === gStone.x && cStone.y === gStone.y)) {
                                                capturedStones.push(gStone);
                                            }
                                        });
                                    }
                                }
                            }
                        });

                        capturedStones.forEach(cStone => {
                            moves.push({ x: cStone.x, y: cStone.y, color: cStone.color, comment: "", isRemove: true, isSetup: false });
                        });
                    }
                }
            }

            if (moves.length > 0) {
                currentHand = moves.length;
                render();
                // 初期配置石とアゲハマ（抜き跡）を除いた「純粋な総手数」を計算
                const totalMovesCount = moves.filter(m => !m.isSetup && !m.isRemove).length;
                alert("総手数 " + totalMovesCount + " 手の棋譜を読み込みました！（アゲハマ自動処理済み）");
            } else {
                alert("SGFの読み込みに失敗しました。有効なデータが見つかりません。");
            }
              }  // ← ★この閉じカッコ「 } 」を1つ追加します！

                comm.innerHTML = `<strong>【解説】</strong><br>${lastComment.replace(/\n/g, '<br>')}`;
                item.appendChild(comm);

                layout.appendChild(item);
                prevMoveNum = targetMoveNum;
            });

            newPrintArea.appendChild(layout);
            document.body.appendChild(newPrintArea);

            setTimeout(() => {
                window.print();
                newPrintArea.remove();
                if (container) container.style.display = 'flex';
                if (h1) h1.style.display = 'block';
                if (subtitle) subtitle.style.display = 'block';
            }, 400);
        });
    function createPrintTarget(parentCell, x, y, posClass) {
        const target = document.createElement('div');
        target.className = 'click-target ' + posClass;
        target.dataset.x = x;
        target.dataset.y = y;

        const hoshiCoords = getHoshiCoords(boardSize);
        let isHoshi = false;
        if (boardSize === 9) {
            isHoshi = ((x === 2 || x === 6) && (y === 2 || y === 6)) || (x === 4 && y === 4);
        } else {
            isHoshi = hoshiCoords.includes(x) && hoshiCoords.includes(y);
        }

        if (isHoshi) {
            const dot = document.createElement('div');
            dot.className = 'hoshi-dot';
            dot.style.top = '50%';
            dot.style.left = '50%';
            dot.style.transform = 'translate(-50%, -50%)';
            target.appendChild(dot);
        }
        parentCell.appendChild(target);
    }



        // 9. 初期起動イベント
        window.addEventListener('DOMContentLoaded', initBoard);
    </script>
</body>
</html>
